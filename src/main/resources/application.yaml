spring:
  application:
    name: carteira
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  threads:
    virtual:
      enabled: true
  rabbitmq:
    # The publisher waits for the broker to confirm each message before marking it sent.
    publisher-confirm-type: simple
    listener:
      simple:
        # A message that keeps failing goes to the dead-letter queue instead of looping forever.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 200ms
          multiplier: 2
  mvc:
    problemdetails:
      enabled: true

carteira:
  jwt:
    # Local default only. Production sets CARTEIRA_JWT_SECRET (32+ bytes).
    secret: ${CARTEIRA_JWT_SECRET:local-dev-secret-change-me-0123456789abcdef}
    ttl: 1h
  outbox:
    publisher:
      enabled: true
      interval: 500ms

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health
