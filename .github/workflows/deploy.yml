name: Deploy

# Runs after CI passes on main. Does nothing until the AWS variables exist in the repository
# (they come from `terraform output`), so the repo stays green before the infrastructure is up.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # OIDC: short-lived AWS credentials, no access keys stored here
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Imagem ARM no ECR e deploy no EC2
    if: >-
      vars.AWS_DEPLOY_ROLE_ARN != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      IMAGE_REPO: ${{ vars.ECR_REPOSITORY_URL }}
      HOSTNAME: ${{ vars.API_HOSTNAME }}
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v4

      - name: Build e push da imagem (arm64, nativo)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ env.SHA }}
            ${{ env.IMAGE_REPO }}:latest
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,scope=arm64,mode=max

      - name: Deploy no servidor via SSM
        run: |
          RAW="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${SHA}/deploy"
          jq -n --arg raw "$RAW" --arg image "$IMAGE_REPO:$SHA" --arg host "$HOSTNAME" '{commands: [
            "set -euo pipefail",
            "cd /opt/carteira",
            "curl -fsSL \($raw)/compose.prod.yaml -o compose.prod.yaml",
            "curl -fsSL \($raw)/Caddyfile -o Caddyfile",
            "curl -fsSL \($raw)/deploy.sh -o deploy.sh",
            "bash deploy.sh \($image) \($host)"
          ], executionTimeout: ["600"]}' > params.json
          CMD=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript --comment "deploy $SHA" \
            --parameters file://params.json --query Command.CommandId --output text)
          echo "SSM command $CMD"
          aws ssm wait command-executed --command-id "$CMD" --instance-id "$INSTANCE_ID" || true
          aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCE_ID" \
            --query '[Status, StandardOutputContent, StandardErrorContent]' --output text
          STATUS=$(aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCE_ID" --query Status --output text)
          test "$STATUS" = "Success"

      - name: Conferir pela internet
        run: |
          curl -fsS --retry 20 --retry-delay 5 --retry-all-errors "https://${HOSTNAME}/actuator/health"
